
name: Game Notice Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: dokkaebi-notice-bot
  cancel-in-progress: false

jobs:
  check-notices:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4

      - name: Python 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 공지 확인 및 전송
        env:
          DOKKAEBI_WEBHOOK: ${{ secrets.DOKKAEBI_WEBHOOK }}
        run: python bot.py

      - name: 중복 방지 데이터 저장
        if: always()
        run: |
          git config user.name "game-notice-bot"
          git config user.email "game-notice-bot@users.noreply.github.com"
          git add seen_posts.json
          if ! git diff --cached --quiet; then
            git commit -m "Update seen posts"
            git push
          fi
