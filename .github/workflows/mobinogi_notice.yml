
name: Mobinogi Notice Bot

on:
  schedule:
    # 15분 간격으로 실행
    - cron: "7,22,37,52 * * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mobinogi-notice-bot
  cancel-in-progress: false

jobs:
  check-notices:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Python 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 패키지 설치
        run: pip install requests beautifulsoup4

      - name: 모비노기 공지 확인
        env:
          MOBINOGI_NOTICE_WEBHOOK: ${{ secrets.MOBINOGI_NOTICE_WEBHOOK }}
        run: python mobinogi_notice.py

      - name: 공지 기록 저장
        run: |
          git add mobinogi_seen_posts.json

          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update Mobinogi notice history"
            git push origin HEAD:main
          else
            echo "저장할 공지 기록 변경 사항이 없습니다."
          fi
